[project]
name = "localrouter"
version = "0.1.0"
description = "LocalRouter / Sinergo — gateway locale e computer collegato a Kairos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "cryptography>=41",
    "zeroconf>=0.148",
    "websockets>=15,<16",
]

[project.optional-dependencies]
voce = [
    "onnxruntime>=1.19",
    "numpy>=1.26",
    "onnx-asr[cpu,hub]==0.12.0",
    "kokoro-onnx==0.6.1",
    "supertonic==1.3.1",
    "av>=16",
]
voce-gpu = [
    "chatterbox-tts==0.1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collegato", "decisori", "media", "sinergo", "transcribe"]

[tool.uv]
package = false
# chatterbox-tts pinna numpy 1.x; kokoro-onnx vuole numpy 2.x. In pratica chatterbox
# gira con numpy 2 (stesso vincolo gia' usato dal resto dell'extra voce).
override-dependencies = ["numpy>=2.0.2"]
