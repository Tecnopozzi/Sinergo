[project]
name = "localrouter"
version = "0.1.0"
description = "LocalRouter / Sinergo — gateway locale e computer collegato a Kairos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "cryptography>=41",
    "zeroconf>=0.148",
    "websockets>=15,<16",
]

[project.optional-dependencies]
voce = [
    "onnxruntime>=1.19",
    "numpy>=1.26",
    "onnx-asr[cpu,hub]==0.12.0",
    "kokoro-onnx==0.6.1",
    "supertonic==1.3.1",
    "av>=16",
]
# Chatterbox: scegli UN extra in base alla scheda (NVIDIA si → cuda, no → cpu).
# installa.py --sinergo lo fa da solo; a mano: uv sync --extra voce --extra chatterbox-cpu|cuda
chatterbox-cpu = [
    "chatterbox-tts==0.1.7",
    # BOSGAME: torch 2.6.0+cpu (indice pytorch-cpu sotto). setuptools<81 serve a perth.
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "setuptools>=70,<81",
]
chatterbox-cuda = [
    "chatterbox-tts==0.1.7",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "setuptools>=70,<81",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collegato", "decisori", "media", "sinergo", "transcribe"]

[tool.uv]
package = false
# chatterbox-tts pinna numpy 1.x; kokoro-onnx vuole numpy 2.x. In pratica chatterbox
# gira con numpy 2 (stesso vincolo gia' usato dal resto dell'extra voce).
override-dependencies = ["numpy>=2.0.2"]
conflicts = [
    [
        { extra = "chatterbox-cpu" },
        { extra = "chatterbox-cuda" },
    ],
]

[tool.uv.sources]
# Indici PyTorch solo sotto 3.14 (cu124/cpu arrivano a 2.6); da 3.14 in su resta PyPI.
torch = [
    { index = "pytorch-cpu", extra = "chatterbox-cpu", marker = "python_full_version < '3.14'" },
    { index = "pytorch-cu124", extra = "chatterbox-cuda", marker = "python_full_version < '3.14'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "chatterbox-cpu", marker = "python_full_version < '3.14'" },
    { index = "pytorch-cu124", extra = "chatterbox-cuda", marker = "python_full_version < '3.14'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
