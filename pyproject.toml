[project]
name = "localrouter"
version = "0.1.0"
description = "LocalRouter / Sinergo — gateway locale e computer collegato a Kairos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "cryptography>=41",
    "zeroconf>=0.148",
    "websockets>=15,<16",
]

[project.optional-dependencies]
voce = [
    "onnxruntime>=1.19",
    "numpy>=1.26",
    "onnx-asr[cpu,hub]==0.12.0",
    "kokoro-onnx==0.6.1",
    "supertonic==1.3.1",
    "av>=16",
]
# Chatterbox via codec.cpp (C++/ggml): una ruota, Vulkan+CPU su Windows, solo CPU su Linux x86_64.
# Altre piattaforme (macOS, arm): l'extra non installa nulla; il motore resta non disponibile.
# installa.py --sinergo: uv sync --extra voce --extra chatterbox
chatterbox = [
    "codec-cpp @ https://github.com/Tecnopozzi/codec.cpp/releases/download/v0.1.0-kairos1/codec_cpp-0.1.0-py3-none-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "codec-cpp @ https://github.com/Tecnopozzi/codec.cpp/releases/download/v0.1.0-kairos1/codec_cpp-0.1.0-py3-none-manylinux_2_31_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collegato", "decisori", "media", "sinergo", "transcribe"]

[tool.uv]
package = false
